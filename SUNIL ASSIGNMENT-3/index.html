<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
        }
        .con{
            height: 600px;
            
        }
        .header{
            height: 20%;
            /* border: 1px solid black; */
            background-color:rgb(161, 134, 186);
        }
        .center{
            display: flex;
            height: 60%;
            /* border: 1px solid black; */
            background-color: rgb(179, 255, 0);
        }
        .footer{
            height: 20%;
            /* border: 1px solid black; */
            background-color: rgb(12, 117, 117);
        }
        .left{
            width: 20%;
             /* border: 1px solid black; */
             background-color: blanchedalmond;
        }
        .right{
            width: 80%;
             /* border: 1px solid black; */
             background-color:  rgb(82, 180, 163);
        }
        .top{
            height: 50%;
             /* border: 1px solid black; */
        }
        .bottom{
            display: flex;
            height: 50%;
             /* border: 1px solid black; */
             background-color: rgb(14, 14, 75);
        }
        .leftbox{
            width: 50%;
             /* border: 1px solid black; */
             background-color: rgb(145, 186, 122);
        }
        .rightbox{
            width: 50%;
            /* border: 1px solid black; */
            background-color: rgb(215, 179, 124);
        }
    </style>
</head>
<body>
    <h1 align="center">Flex Box</h1>
    <div class="con">
        <div class="header"></div>
            <div class="center">
                <div class="left"></div>
                <div class="right">
                    <div class="top"></div>
                    <div class="bottom">
                        <div class="leftbox"></div>
                        <div class="rightbox"></div>
            </div>
        </div>
    </div>
    <div class="footer"></div>
</body>
</html>
