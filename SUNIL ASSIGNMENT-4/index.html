<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        .container{
            display: flex;
            height: 600px;
           

        }
        .box{
            height: 100%;
            width: 25%;
            
        }
        img{
            width: 100%;
        }
        
    </style>
</head>
<body>
    <h1 align="center">Dynamic Gallery</h1>
    <div class="container">
        <div class="box 1">
            <img src="image3.png" alt="">
            <img src="image4.png" alt="">
            <img src="image6.jpg" alt="">
            <img src="images.jpg" alt="">
        </div>
        <div class="box 2">
             <img src="images.jpg" alt="">
            <img src="image6.jpg" alt="">
            <img src="image4.png" alt="">
            <img src="image3.png" alt="">
        </div>
        <div class="box 3">
             <img src="image6.jpg" alt="">
            <img src="image4.png" alt="">
            <img src="image3.png" alt="">
            <img src="images.jpg" alt="">
        </div>
        <div class="box 4">
             <img src="image4.png" alt="">
            <img src="images.jpg" alt="">
            <img src="image6.jpg" alt="">
            <img src="image3.png" alt="">
        </div>
    </div>
    
</body>
</html>
