<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .con{
            height: 600px;
            /* border: 1px solid black; */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            /* border: 1px solid black; */
            display: flex;
             box-shadow: 10px 10px 10px ;
             border-radius: 20px;
        }
        .left,.center,.right{
            height: 100%;
            /* border: 1px solid black; */
        }
        .left{
            background-color: navy;
            width: 3%;
            border-radius: 20px;
        }
        .center{
            width: 62%;
            font-size: 120px;            
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            color: navy;
            background-color: whitesmoke;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .right{
            width: 35%;
           
            border-radius: 20px ;
        }
        .top{
            height: 30%;
            /* border: 1px solid black ; */
        }
         .bottom{
            height: 70%;
            /* border: 1px solid black ; */
         }
         .top-in{
            border-top-left-radius: 20px;
            border-top-right-radius: 20px ;
            height: 90%;
            background-color: navy;
            /* background: linear-gradient(red); */
         }
         .circle{
            height: 125px;
            width: 125px;
            border: 5px solid navy;
            border-radius: 50%;
            position: absolute;
            top: 65px;
            right: 390px;

         }
         img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;
         }
         .bottom>h1{
            text-align: center;
         }
         .button{
            height: 20%;
            /* border: 1px solid black; */
            display: flex;
            justify-content: space-evenly;
            align-items: center;
         }
         .button1{
            border-radius: 20px;
            height: 50%;
            width: 40%;
            background-color: navy;
            text-align: center;
            color: white;
            line-height: 30px;
         }
         .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
         }
         .fa-facebook{
            color: blue;
         }
         .fa-instagram{
            background: linear-gradient(purple, red,yellow,orange);
            color: transparent;
            background-clip: text;
         }
         .fa-github{
            color: violet;
         }
         .fa-linkedin{
            color: blue;
         }
         .fa-behance{
            color: green ;
         }
         .fa-comment{
            /* color: rgb(158, 224, 158 0.50) ; */
         }
          .fa-heart{
            color: red ;
         }
          .fa-share{
            color: silver ;
         }
    </style>
</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center"><p>Profile Card UI UX Design</P></div>
            <div class="right">
                <div class="top">
                <div class="top-in">
                    <div class="circle">
                        <img src="image4.png" alt="">
                    </div>
                </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h1>Dezyne Ecole College</h1>
                    <h1>BCA 1st Year</h1>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook fa-2x"></i>
                        <i class="fa fa-brands fa-instagram fa-2x"></i>
                        <i class="fa fa-brands fa-github fa-2x"></i>
                        <i class="fa fa-brands fa-linkedin fa-2x"></i>
                        <i class="fa fa-brands fa-behance fa-2x"></i>    
                    </div>
                    <div class="button">
                        <div class="button1">
                            Subscribe
                        </div>
                        <div class="button1">Message</div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-Solid  fa-heart fa-2x"></i>60.4k
                        <i class="fa fa-Solid fa-comment fa-2x"></i>20k
                        <i class="fa fa-Solid fa-share fa-2x"></i>12.6k
                          <!-- <i class="fa fa-Solid fa-link fa-2x"></i>  -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
